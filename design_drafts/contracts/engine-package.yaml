            - name: "list_runs"
              signature: "(self, status: str = None) -> list[dict]"
          schema:
            tables:
              - name: "engine_runs"
                columns:
                  - "id TEXT PRIMARY KEY"
                  - "prd_path TEXT NOT NULL"
                  - "project_path TEXT NOT NULL"
                  - "config TEXT NOT NULL"
                  - "state TEXT NOT NULL DEFAULT 'IDLE'"
                  - "current_task_id TEXT"
                  - "tasks_json TEXT"
                  - "started_at TEXT DEFAULT (datetime('now'))"
                  - "completed_at TEXT"
                  - "result_json TEXT"
                  - "error_message TEXT"
              - name: "engine_task_results"
                columns:
                  - "id INTEGER PRIMARY KEY AUTOINCREMENT"
                  - "run_id TEXT NOT NULL REFERENCES engine_runs(id)"
                  - "task_id TEXT NOT NULL"
                  - "state TEXT NOT NULL"
                  - "generated_code TEXT"
                  - "validation_result TEXT"
                  - "test_result TEXT"
                  - "commit_sha TEXT"
                  - "attempts INTEGER DEFAULT 0"
                  - "started_at TEXT"
                  - "completed_at TEXT"
                  - "error_message TEXT"

    - file: "engine/events.py"
      description: "Event bridge — fire-and-forget to streaming"
      pattern: "Observer"
      classes:
        - name: "EventBridge"
          methods:
            - name: "emit"
              signature: "(self, event_type: str, data: dict) -> None"
              description: "Fire-and-forget event emission"
            - name: "emit_transition"
