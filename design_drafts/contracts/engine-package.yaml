              signature: "(self, project_path: str, task: Task, code: GeneratedCode, test_result: TestResult) -> CommitResult"
          dataclasses:
            - name: "CommitResult"
              fields:
                - name: "success"
                  type: "bool"
                - name: "sha"
                  type: "str | None"
                - name: "branch"
                  type: "str"
                - name: "pushed"
                  type: "bool"
                - name: "error_message"
                  type: "str | None"
          dependencies:
