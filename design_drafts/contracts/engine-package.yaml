          methods:
            - name: "__init__"
              signature: "(self, transport=None, streaming_url=None, config=None)"
              returns: "None"
              description: "Cache transport, init state DB, create pipeline"
            - name: "run"
              signature: "(self, prd_path: str, project_path: str, config: str = None, dry_run: bool = False) -> RunResult"
              description: "Execute a PRD end-to-end. The primary public API."
            - name: "step"
              signature: "(self, task_id: str) -> StepResult"
              description: "Execute a single task (manual control mode)."
            - name: "status"
              signature: "(self, run_id: str = None) -> RunStatus"
              description: "Get pipeline status. If run_id is None, return current run."
            - name: "cancel"
              signature: "(self) -> bool"
              description: "Cancel gracefully. Checkpoints state. Returns True if cancelled."
          dependencies:
            - "engine.pipeline.Pipeline"
            - "engine.state.RunState"
            - "engine.events.EventBridge"
            - "transport.get_transport"
      dataclasses:
        - name: "RunResult"
          fields:
            - name: "run_id"
              type: "str"
            - name: "success"
              type: "bool"
            - name: "prd_path"
              type: "str"
            - name: "project_path"
              type: "str"
            - name: "config"
              type: "str"
            - name: "total_time_s"
              type: "float"
            - name: "tasks"
              type: "list[TaskResult]"
            - name: "states_visited"
              type: "list[State]"
            - name: "total_tokens"
              type: "int"
            - name: "total_thinking_tokens"
              type: "int"
            - name: "first_pass_rate"
              type: "float"
            - name: "test_pass_rate"
              type: "float"
            - name: "error_message"
              type: "str | None"
        - name: "TaskResult"
          fields:
            - name: "task_id"
              type: "str"
            - name: "title"
              type: "str"
            - name: "state"
              type: "State"
            - name: "attempts"
              type: "int"
            - name: "validation_stages_passed"
              type: "int"
            - name: "tests_passed"
              type: "int"
            - name: "tests_failed"
              type: "int"
            - name: "commit_sha"
              type: "str | None"
            - name: "time_s"
              type: "float"
            - name: "tokens"
              type: "int"
            - name: "error_message"
              type: "str | None"
        - name: "StepResult"
          fields:
            - name: "task_id"
              type: "str"
            - name: "state"
              type: "State"
            - name: "success"
              type: "bool"
            - name: "detail"
              type: "dict"
        - name: "RunStatus"
          fields:
            - name: "run_id"
              type: "str"
            - name: "state"
              type: "State"
            - name: "progress_pct"
              type: "float"
            - name: "current_task"
              type: "str | None"
            - name: "tasks_completed"
              type: "int"
            - name: "tasks_total"
              type: "int"
            - name: "elapsed_s"
              type: "float"
            - name: "eta_s"
              type: "float | None"

    - file: "engine/pipeline.py"
      description: "12-state state machine with validated transitions"
      pattern: "State Machine"
      classes:
        - name: "State"
          pattern: "Enum"
          values: ["IDLE", "PARSING", "QUEUED", "CONTEXT", "GENERATE", "VALIDATE", "TEST", "COMMIT", "NEXT", "DONE", "FAILED", "CANCELLED"]
        - name: "Pipeline"
          methods:
            - name: "__init__"
              signature: "(self, engine: 'Engine')"
            - name: "transition"
              signature: "(self, new_state: State, **kwargs) -> TransitionResult"
              description: "Validate transition, update state, log, checkpoint, emit event"
            - name: "checkpoint"
              signature: "(self) -> None"
              description: "Persist current state to SQLite"
            - name: "resume"
              signature: "(cls, run_id: str, engine: 'Engine') -> 'Pipeline'"
              pattern: "classmethod"
              description: "Restore from SQLite checkpoint"
            - name: "cancel"
              signature: "(self) -> None"
              description: "Transition to CANCELLED, checkpoint"
            - name: "get_progress"
              signature: "(self) -> float"
              description: "Return 0-100 progress percentage"
          transitions: "See state-machine-engine.mmd"
          valid_transitions:
            IDLE: ["PARSING", "CANCELLED"]
            PARSING: ["QUEUED", "FAILED", "CANCELLED"]
            QUEUED: ["CONTEXT", "DONE", "CANCELLED"]
            CONTEXT: ["GENERATE", "CANCELLED"]
            GENERATE: ["VALIDATE", "FAILED", "CANCELLED"]
            VALIDATE: ["TEST", "GENERATE", "FAILED", "CANCELLED"]
            TEST: ["COMMIT", "GENERATE", "FAILED", "CANCELLED"]
            COMMIT: ["NEXT", "QUEUED", "CANCELLED"]
            NEXT: ["QUEUED", "DONE", "CANCELLED"]
            DONE: []
            FAILED: []
            CANCELLED: []

    - file: "engine/context.py"
      description: "Project context builder — file tree, imports, framework detection"
      pattern: "Builder"
      classes:
        - name: "ContextBuilder"
          methods:
            - name: "build"
              signature: "(self, project_path: str, task: Task) -> Context"
              description: "Build project context for a task"
          dataclasses:
            - name: "Context"
              fields:
                - name: "file_tree"
                  type: "dict"
                - name: "relevant_files"
                  type: "list[str]"
                - name: "imports"
                  type: "dict[str, list[str]]"
                - name: "framework"
                  type: "str | None"
                - name: "existing_code"
                  type: "dict[str, str]"
          dependencies:
            - "transport.get_transport"

    - file: "engine/generator.py"
      description: "Code generation — prompt_compiler + BeeLlama + extraction"
      pattern: "Strategy"
      classes:
        - name: "CodeGenerator"
          methods:
            - name: "generate"
              signature: "(self, context: Context, task: Task, error_ctx: ErrorContext = None) -> GeneratedCode"
              description: "Build prompt, call BeeLlama, extract code blocks"
          dataclasses:
            - name: "GeneratedCode"
              fields:
                - name: "files"
                  type: "dict[str, str]"
                - name: "raw_response"
                  type: "str"
                - name: "tokens"
                  type: "int"
                - name: "thinking_tokens"
                  type: "int"
                - name: "latency_ms"
                  type: "float"
                - name: "model"
                  type: "str"
            - name: "ErrorContext"
              fields:
                - name: "previous_code"
                  type: "str | None"
                - name: "validation_errors"
                  type: "list[str]"
                - name: "test_failures"
                  type: "list[str]"
                - name: "attempt_number"
                  type: "int"
          dependencies:
            - "prompt_compiler.PromptCompiler"
            - "transport.get_transport"

    - file: "engine/validator.py"
      description: "4-stage validation — AST, syntax, imports, execution"
      pattern: "Chain of Responsibility"
      classes:
        - name: "Validator"
          methods:
            - name: "validate"
              signature: "(self, code: GeneratedCode, context: Context) -> ValidationResult"
              description: "Run all 4 validation stages"
          dataclasses:
            - name: "ValidationResult"
              fields:
                - name: "passed"
                  type: "bool"
                - name: "stages"
                  type: "list[ValidationStageResult]"
                - name: "errors"
                  type: "list[str]"
            - name: "ValidationStageResult"
              fields:
                - name: "stage"
                  type: "str"
                  enum: ["ast", "syntax", "imports", "execution"]
                - name: "passed"
                  type: "bool"
                - name: "error"
                  type: "str | None"
                - name: "details"
                  type: "dict"

    - file: "engine/tester.py"
      description: "Test runner — pytest execution via transport"
      pattern: "Adapter"
      classes:
        - name: "TestRunner"
          methods:
            - name: "test"
              signature: "(self, project_path: str, timeout: int = 180) -> TestResult"
          dataclasses:
            - name: "TestResult"
