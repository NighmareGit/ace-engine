  shared_types:
    - name: "Task"
      description: "A single atomic coding unit derived from a PRD"
      fields:
        - name: "id"
          type: "str"
        - name: "title"
          type: "str"
        - name: "description"
          type: "str"
        - name: "module"
          type: "str"
        - name: "dependencies"
          type: "list[str]"
        - name: "task_type"
          type: "str"
        - name: "priority"
          type: "int"

  design_patterns:
    - pattern: "State Machine"
      application: "pipeline.py — 12-state machine with validated transitions"
    - pattern: "Facade"
      application: "engine.py — Engine class hides all internal complexity"
    - pattern: "Builder"
      application: "context.py — ContextBuilder constructs Context from project files"
    - pattern: "Strategy"
      application: "generator.py — CodeGenerator strategy for prompt → code"
    - pattern: "Chain of Responsibility"
      application: "validator.py — 4 validation stages in sequence"
    - pattern: "Adapter"
      application: "tester.py, committer.py — adapt transport to domain interfaces"
    - pattern: "Repository"
      application: "state.py — RunState persists to SQLite"
    - pattern: "Observer"
      application: "events.py — EventBridge emits to streaming server"
