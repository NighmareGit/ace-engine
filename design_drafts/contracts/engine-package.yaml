engine_package:
  path: "engine/"
  modules:
    - file: "engine/__init__.py"
      description: "Package init, EngineConfig dataclass, version, constants"
      classes:
        - name: "EngineConfig"
          pattern: "Dataclass"
          fields:
            - name: "model_config"
              type: "str"
              default: '"3090-qwen36-35b"'
            - name: "max_retries_generate"
              type: "int"
              default: "3"
            - name: "max_retries_test"
              type: "int"
              default: "2"
            - name: "timeout_inference"
              type: "int"
              default: "300"
            - name: "timeout_test"
              type: "int"
              default: "180"
            - name: "timeout_commit"
              type: "int"
              default: "60"
            - name: "timeout_context"
              type: "int"
              default: "120"
            - name: "dry_run"
