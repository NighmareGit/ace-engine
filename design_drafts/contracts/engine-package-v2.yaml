# Interface & Contract Blueprint v2: engine/ Package
# Reconciled after Pragmatic Review + Blueprint Innovator (Iteration 0)
# Changes: Reduced patterns from 8 to 3, simplified module structure

engine_package:
  path: "engine/"
  version: "2.0"
  principles:
    - "No class hierarchy without a reason — prefer plain functions"
    - "No named pattern unless it solves a real variation problem"
    - "Every module is importable as a single function call"
    - "Dunder methods and dataclasses over abstract base classes"

  modules:
    - file: "engine/__init__.py"
      description: "Package init, EngineConfig dataclass, version, constants"
      classes:
        - name: "EngineConfig"
          pattern: "Dataclass"
          fields:
            - name: "model_config"
              type: "str"
              default: '"3090-qwen36-35b"'
            - name: "max_retries_generate"
              type: "int"
              default: "3"
            - name: "max_retries_test"
              type: "int"
              default: "2"
            - name: "timeout_inference"
              type: "int"
              default: "300"
            - name: "timeout_test"
              type: "int"
              default: "180"
            - name: "timeout_commit"
              type: "int"
              default: "60"
            - name: "timeout_context"
              type: "int"
              default: "120"
            - name: "dry_run"
              type: "bool"
              default: "False"
            - name: "sandbox"
              type: "bool"
              default: "False"
            - name: "on_event"
              type: "Callable | None"
              default: "None"
              description: "Optional event callback — replaces Observer pattern"

    - file: "engine/engine.py"
      description: "The one entry point — Engine class (Facade pattern only)"
      pattern: "Facade"
      classes:
        - name: "Engine"
          methods:
            - name: "__init__"
              signature: "(self, transport=None, on_event=None, config=None)"
            - name: "run"
              signature: "(self, prd_path: str, project_path: str, config: EngineConfig = None, dry_run: bool = False) -> RunResult"
            - name: "step"
              signature: "(self, task_id: str) -> StepResult"
            - name: "status"
              signature: "(self, run_id: str = None) -> RunStatus"
            - name: "cancel"
              signature: "(self) -> bool"
      dataclasses:
        - name: "RunResult"
          fields:
            - name: "run_id"
              type: "str"
            - name: "success"
              type: "bool"
            - name: "prd_path"
              type: "str"
            - name: "project_path"
              type: "str"
            - name: "total_time_s"
              type: "float"
            - name: "tasks"
              type: "list[TaskResult]"
            - name: "states_visited"
              type: "list[State]"
            - name: "total_tokens"
              type: "int"
            - name: "error_message"
              type: "str | None"
        - name: "TaskResult"
          fields:
            - name: "task_id"
              type: "str"
            - name: "title"
              type: "str"
            - name: "state"
              type: "State"
            - name: "attempts"
              type: "int"
            - name: "commit_sha"
              type: "str | None"
            - name: "time_s"
              type: "float"
            - name: "tokens"
              type: "int"
            - name: "error_message"
              type: "str | None"
        - name: "RunStatus"
          fields:
            - name: "run_id"
              type: "str"
            - name: "state"
              type: "State"
            - name: "progress_pct"
              type: "float"
            - name: "current_task"
              type: "str | None"
            - name: "tasks_completed"
              type: "int"
            - name: "tasks_total"
              type: "int"
            - name: "elapsed_s"
              type: "float"

    - file: "engine/pipeline.py"
      description: "12-state state machine — State Machine pattern only"
      pattern: "State Machine"
      classes:
        - name: "State"
          pattern: "Enum"
          values: ["IDLE", "PARSING", "QUEUED", "CONTEXT", "GENERATE", "VALIDATE", "TEST", "COMMIT", "NEXT", "DONE", "FAILED", "CANCELLED"]
        - name: "Pipeline"
          methods:
            - name: "__init__"
              signature: "(self, engine: 'Engine')"
            - name: "transition"
              signature: "(self, new_state: State, **kwargs) -> TransitionResult"
            - name: "checkpoint"
              signature: "(self) -> None"
            - name: "resume"
              signature: "(cls, run_id: str, engine: 'Engine') -> 'Pipeline'"
              pattern: "classmethod"
            - name: "cancel"
              signature: "(self) -> None"
          valid_transitions:
            IDLE: ["PARSING", "CANCELLED"]
            PARSING: ["QUEUED", "FAILED", "CANCELLED"]
            QUEUED: ["CONTEXT", "DONE", "CANCELLED"]
            CONTEXT: ["GENERATE", "CANCELLED"]
            GENERATE: ["VALIDATE", "FAILED", "CANCELLED"]
            VALIDATE: ["TEST", "GENERATE", "FAILED", "CANCELLED"]
            TEST: ["COMMIT", "GENERATE", "FAILED", "CANCELLED"]
            COMMIT: ["NEXT", "QUEUED", "CANCELLED"]
            NEXT: ["QUEUED", "DONE", "CANCELLED"]
            DONE: []
            FAILED: []
            CANCELLED: []

    - file: "engine/context.py"
      description: "Project context builder — plain function, no Builder pattern"
      pattern: "none"
      functions:
        - name: "build_context"
          signature: "(project_path: str, task: Task, transport) -> Context"
          description: "Read files, detect framework, assemble context dict"
      dataclasses:
        - name: "Context"
          fields:
            - name: "file_tree"
              type: "dict"
            - name: "relevant_files"
              type: "list[str]"
            - name: "imports"
              type: "dict[str, list[str]]"
            - name: "framework"
              type: "str | None"
            - name: "existing_code"
              type: "dict[str, str]"

    - file: "engine/generator.py"
      description: "Code generation — plain function calling prompt_compiler + BeeLlama"
      pattern: "none"
      functions:
        - name: "generate_code"
          signature: "(context: Context, task: Task, config: EngineConfig, transport, error_ctx: ErrorContext = None) -> GeneratedCode"
          description: "Build prompt via prompt_compiler, call BeeLlama via transport, extract code blocks"
      dataclasses:
        - name: "GeneratedCode"
          fields:
            - name: "files"
              type: "dict[str, str]"
            - name: "raw_response"
              type: "str"
            - name: "tokens"
              type: "int"
            - name: "thinking_tokens"
              type: "int"
            - name: "latency_ms"
              type: "float"
        - name: "ErrorContext"
          fields:
            - name: "previous_code"
              type: "str | None"
            - name: "validation_errors"
              type: "list[str]"
            - name: "test_failures"
              type: "list[str]"
            - name: "attempt_number"
              type: "int"

    - file: "engine/validator.py"
      description: "4-stage validation — plain functions in sequence, no Chain of Responsibility"
      pattern: "none"
      functions:
        - name: "validate"
          signature: "(code: GeneratedCode, context: Context) -> ValidationResult"
          description: "Run check_ast, check_syntax, check_imports, check_execution in sequence"
        - name: "check_ast"
          signature: "(code: str) -> (bool, str | None)"
        - name: "check_syntax"
          signature: "(code: str) -> (bool, str | None)"
        - name: "check_imports"
          signature: "(code: str, known_imports: dict) -> (bool, str | None)"
        - name: "check_execution"
          signature: "(code: str, namespace: dict) -> (bool, str | None)"
      dataclasses:
        - name: "ValidationResult"
          fields:
            - name: "passed"
              type: "bool"
            - name: "stages"
              type: "list[dict]"
              description: "List of {stage, passed, error} dicts"

    - file: "engine/tester.py"
      description: "Test runner — plain function calling pytest via transport"
      pattern: "none"
      functions:
        - name: "run_tests"
          signature: "(project_path: str, transport, timeout: int = 180) -> TestResult"
      dataclasses:
        - name: "TestResult"
          fields:
            - name: "passed"
              type: "bool"
            - name: "tests_passed"
              type: "int"
            - name: "tests_failed"
              type: "int"
            - name: "failures"
              type: "list[dict]"
            - name: "raw_output"
              type: "str"

    - file: "engine/committer.py"
      description: "Git + Gitea — plain function calling transport"
      pattern: "none"
      functions:
        - name: "commit_code"
          signature: "(project_path: str, task: Task, code: GeneratedCode, transport) -> CommitResult"
          description: "Branch, write files, commit, push via transport"
      dataclasses:
        - name: "CommitResult"
          fields:
            - name: "success"
              type: "bool"
            - name: "sha"
              type: "str | None"
            - name: "branch"
              type: "str"
            - name: "error_message"
              type: "str | None"

    - file: "engine/state.py"
      description: "Run state persistence — plain sqlite3 functions, no Repository pattern"
      pattern: "none"
      functions:
        - name: "init_db"
          signature: "() -> None"
          description: "Create engine_runs and engine_task_results tables"
        - name: "checkpoint_run"
          signature: "(run_id: str, state: dict) -> None"
          description: "INSERT OR REPLACE into engine_runs"
        - name: "save_task_result"
          signature: "(run_id: str, task_id: str, result: dict) -> None"
          description: "INSERT OR REPLACE into engine_task_results"
        - name: "load_run"
          signature: "(run_id: str) -> dict | None"
          description: "SELECT from engine_runs"
        - name: "list_runs"
          signature: "(status: str = None) -> list[dict]"
          description: "SELECT from engine_runs with optional filter"
      schema:
        tables:
          - name: "engine_runs"
            columns:
              - "id TEXT PRIMARY KEY"
              - "prd_path TEXT NOT NULL"
              - "project_path TEXT NOT NULL"
              - "config TEXT NOT NULL"
              - "state TEXT NOT NULL DEFAULT 'IDLE'"
              - "current_task_id TEXT"
              - "tasks_json TEXT"
              - "task_retries_json TEXT"
              - "started_at TEXT DEFAULT (datetime('now'))"
              - "completed_at TEXT"
              - "result_json TEXT"
              - "error_message TEXT"
          - name: "engine_task_results"
            columns:
              - "id INTEGER PRIMARY KEY AUTOINCREMENT"
              - "run_id TEXT NOT NULL REFERENCES engine_runs(id)"
              - "task_id TEXT NOT NULL"
              - "state TEXT NOT NULL"
              - "generated_code TEXT"
              - "validation_result TEXT"
              - "test_result TEXT"
              - "commit_sha TEXT"
              - "attempts INTEGER DEFAULT 0"
              - "started_at TEXT"
              - "completed_at TEXT"
              - "error_message TEXT"

    - file: "engine/events.py"
      description: "Event emission — plain function, no Observer pattern"
      pattern: "none"
      functions:
        - name: "emit_event"
          signature: "(on_event: Callable | None, event_type: str, data: dict) -> None"
          description: "If on_event is set, call it. Otherwise no-op. 5 lines."
          note: "Replaces the Observer pattern entirely. The Engine passes on_event callback through."

  shared_types:
    - name: "Task"
      description: "A single atomic coding unit derived from a PRD"
      fields:
        - name: "id"
          type: "str"
          example: "T01"
        - name: "title"
          type: "str"
          example: "Create health check endpoint"
        - name: "description"
          type: "str"
        - name: "module"
          type: "str"
          example: "api/health.py"
        - name: "dependencies"
          type: "list[str]"
        - name: "task_type"
          type: "str"
          enum: ["implementation", "refactoring", "debug", "test"]
        - name: "priority"
          type: "int"
        - name: "prd_section"
          type: "str"

    - name: "TransitionResult"
      description: "Result of a state machine transition"
      fields:
        - name: "from_state"
          type: "State"
        - name: "to_state"
          type: "State"
        - name: "timestamp"
          type: "str"
        - name: "checkpoint_saved"
          type: "bool"
        - name: "event_emitted"
          type: "bool"
        - name: "error"
          type: "str | None"

  design_patterns:
    - pattern: "State Machine"
      application: "pipeline.py — 12-state machine with validated transitions. This is the ONE legitimate pattern."
      justification: "Pipeline control flow genuinely needs state tracking, transition validation, and checkpoint/resume."
    - pattern: "Facade"
      application: "engine.py — Engine class hides all internal complexity behind run()/step()/status()/cancel()"
      justification: "Natural public API pattern. Hides 8 modules behind 4 methods."
    - pattern: "Dataclass"
      application: "All data transfer objects (RunResult, TaskResult, Context, GeneratedCode, etc.)"
      justification: "Pythonic, auto-generates __init__/__repr__/__eq__, no boilerplate."

  anti_patterns:
    - pattern: "Strategy"
      reason: "Only one backend (BeeLlama). Extract interface IF a second backend appears."
    - pattern: "Chain of Responsibility"
      reason: "Fixed 4-step pipeline. Plain function calling 4 sub-functions."
    - pattern: "Builder"
      reason: "Context gathered in one pass. Plain function returning dataclass."
    - pattern: "Repository"
      reason: "2 SQLite tables, single writer. Plain sqlite3 functions."
    - pattern: "Observer"
      reason: "One consumer (streaming). Optional callback parameter."
    - pattern: "Adapter"
      reason: "Transport already provides the abstraction. No need to wrap it."
    - pattern: "Registry"
      reason: "No runtime plugin registration needed. Hardcoded module calls."
    - pattern: "Circuit Breaker"
      reason: "Transport already has retry logic. Adding CB on top is defense-in-depth for a problem that doesn't exist yet."
    - pattern: "Memento"
      reason: "SQLite checkpoint IS the memento. No separate memento layer needed."
    - pattern: "Template Method"
      reason: "Pipeline transition() already IS the template. No need to formalize it as a class hierarchy."
    - pattern: "Null Object"
      reason: "None checks are fine. NullObject adds indirection for zero variation."
    - pattern: "Decorator (Retry)"
      reason: "Simple for-loop retry is 5 lines. Decorator adds import + registration overhead."

  summary:
    patterns_kept: 2 (State Machine, Facade) + Dataclass (language feature)
    patterns_removed: 11 (Strategy, Chain of Responsibility, Builder, Repository, Observer, Adapter, Registry, Circuit Breaker, Memento, Template Method, Null Object, Decorator)
    modules: 10 (engine, pipeline, context, generator, validator, tester, committer, state, events, __init__)
    total_classes: ~15 (down from ~30 in v1)
    total_functions: ~15 plain functions (down from ~20 class methods)
